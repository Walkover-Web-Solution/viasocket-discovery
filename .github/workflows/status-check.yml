name: Status check

on:
  pull_request:

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check STATUS.md is current
        env:
          STATUS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run status:check
